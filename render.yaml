services:
  - type: web
    name: travelmate-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: HOST
        value: 0.0.0.0
      - key: PRODUCTION
        value: true
      - key: ALLOWED_ORIGINS
        value: "*"
