<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="40%" stop-color="#047857"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountainBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#011e17"/>
    </linearGradient>
    <linearGradient id="heroDarkOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="480" fill="url(#skyGrad)"/>

  <!-- Morning Sun & Atmospheric Glow -->
  <circle cx="560" cy="140" r="160" fill="url(#sunGlow)"/>
  <circle cx="560" cy="140" r="32" fill="#fffbeb" opacity="0.9"/>

  <!-- Western Ghats Mountains - Background Range (Chikkamagaluru & Kudremukh) -->
  <path d="M-40 280 Q 90 140 220 220 T 480 180 T 720 160 Q 820 130 850 210 L 850 480 L -40 480 Z" fill="url(#mountainBack)"/>

  <!-- Clouds & Morning Valley Mist -->
  <ellipse cx="260" cy="220" rx="180" ry="22" fill="#ffffff" opacity="0.18"/>
  <ellipse cx="620" cy="200" rx="200" ry="26" fill="#ffffff" opacity="0.22"/>
  <ellipse cx="400" cy="260" rx="240" ry="30" fill="#ffffff" opacity="0.15"/>

  <!-- Western Ghats Mountains - Mid Range (Nandi Hills & Mullayanagiri) -->
  <path d="M-20 320 Q 140 210 310 270 T 580 230 T 820 250 L 820 480 L -20 480 Z" fill="url(#mountainMid)"/>

  <!-- Heritage Architecture Silhouette (Hampi Stone Chariot & Mysore Palace arches) -->
  <g opacity="0.35" transform="translate(480, 250) scale(0.65)">
    <!-- Temple Gopuram / Chariot Dome -->
    <path d="M120 120 L 150 40 L 180 120 Z" fill="#011e17"/>
    <rect x="135" y="15" width="30" height="25" fill="#011e17"/>
    <polygon points="150,0 130,15 170,15" fill="#011e17"/>
    <rect x="80" y="120" width="140" height="50" fill="#011e17"/>
    <circle cx="100" cy="170" r="22" fill="#011e17"/>
    <circle cx="200" cy="170" r="22" fill="#011e17"/>
  </g>

  <!-- Foreground Lush Green Ridge -->
  <path d="M0 380 Q 180 320 380 370 T 800 340 L 800 480 L 0 480 Z" fill="url(#mountainFront)"/>

  <!-- Silhouetted Coconut Palms & Tropical Flora -->
  <g fill="#022c22">
    <!-- Palm 1 -->
    <path d="M720 480 Q 730 400 735 340" stroke="#022c22" stroke-width="6" fill="none"/>
    <path d="M735 340 Q 690 320 670 335" stroke="#022c22" stroke-width="3" fill="none"/>
    <path d="M735 340 Q 710 305 690 310" stroke="#022c22" stroke-width="3" fill="none"/>
    <path d="M735 340 Q 755 305 780 315" stroke="#022c22" stroke-width="3" fill="none"/>
    <path d="M735 340 Q 770 325 790 345" stroke="#022c22" stroke-width="3" fill="none"/>
    <!-- Palm 2 -->
    <path d="M760 480 Q 770 410 772 360" stroke="#022c22" stroke-width="5" fill="none"/>
    <path d="M772 360 Q 740 340 725 355" stroke="#022c22" stroke-width="2.5" fill="none"/>
    <path d="M772 360 Q 795 335 815 350" stroke="#022c22" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Dramatic Dark Gradient Overlay for High Contrast Text Legibility -->
  <rect width="800" height="480" fill="url(#heroDarkOverlay)"/>
</svg>
